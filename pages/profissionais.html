<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>HOSPITAL CRMJ - Profissionais</title>
    <link rel="stylesheet" href="../public/css/profissionais.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header>
        <h1>Hospital CRMJ</h1>

        <a href="../index.html" class="sair">
            <span>&#8618;</span>
        </a>
    </header>

    <main class="container">

        <section class="painel">

            <div class="barra-pesquisa">
                <i class="bi bi-search lupa"></i>
                <input type="text" id="pesquisa" placeholder="Pesquisar profissional">
            </div>

            <div class="conteudo">

                <aside class="filtros">
                    <h2>Filtros</h2>
                        <label class="filtro-item">
                            <input type="checkbox" class="filtro-status" value="ATIVO">
                            Ativo
                        </label>

                        <label class="filtro-item">
                            <input type="checkbox" class="filtro-status" value="FERIAS">
                            Férias
                        </label>

                        <label class="filtro-item">
                            <input type="checkbox" class="filtro-status" value="DESATIVADO">
                            Desativado
                        </label>

                    <a href="./cadastro.html" class="btn-add">
                        Adicionar Profissional
                    </a>
                </aside>

                <section class="lista-profissionais">

                    <div class="cabecalho-lista">
                        <span>ID</span>
                        <span>Nome</span>
                        <span>CRM</span>
                        <span>Status</span>
                    </div>

                    <div class="linhas" id="linhasProfissionais"></div>

                </section>

            </div>

        </section>

    </main>

    <script src="../public/js/profissionais.js"></script>
</body>

</html>
