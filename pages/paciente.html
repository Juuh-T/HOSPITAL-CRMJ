<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOSPITAL CRMJ - Paciente</title>
    <link rel="stylesheet" href="../public/css/paciente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header>
        <h1>Hospital CRMJ</h1>
        <a href="../index.html" class="sair">
            <span>&#8618;</span>
        </a>
    </header>

    <main class="container">

        <aside class="sidebar">
            <div class="barra-pesquisa">
                <i class="bi bi-search lupa"></i>
                <div class="input-field">
                    <input type="text" id="campoPesquisa" placeholder="Pesquisar nome ou CPF">
                </div>
            </div>

            <div class="painel-lateral">
                <button class="btn-add" onclick="window.location.href='cadastro-paciente.html'">Adicionar paciente</button>
                <hr>
                <div class="lista-pacientes"></div>
                </div>
            </div>
        </aside>

        <section class="conteudo">
            <div class="cabecalho-paciente">
                <h2 id="tituloPaciente"></h2>
            </div>

            <div class="dados">
                <p class="linha-dado">
                    <i class="bi bi-pencil-square"></i>
                    <span>Nome:</span>
                    <input type="text" id="nomePaciente" class="campo-dado" readonly>
                </p>

                <p class="linha-dado">
                    <i class="bi bi-person"></i>
                    <span>CPF:</span>
                    <input type="text" id="cpf" class="campo-dado" readonly>
                </p>

                <p class="linha-dado">
                    <i class="bi bi-calendar"></i>
                    <span>Idade:</span>
                    <input type="text" id="idadePaciente" class="campo-dado" readonly>
                </p>

                <p class="linha-dado">
                    <i class="bi bi-speedometer2"></i>
                    <span>Peso:</span>
                    <input type="text" id="pesoPaciente" class="campo-dado" readonly>
                </p>

                <p class="linha-dado">
                    <i class="bi bi-gender-ambiguous"></i>
                    <span>Sexo:</span>
                    <input type="text" id="sexooPaciente" class="campo-dado" readonly>
                </p>

            </div>
            
        </section>

    </main>
    <script src="../public/js/paciente.js"></script>
</body>
</html>
