<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>HOSPITAL CRMJ - Cadastro</title>
    <link rel="stylesheet" href="../public/css/cadastro-paciente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header>
        <a href="paciente.html" style="color: inherit; text-decoration: none;">
            <h1>Hospital CRMJ</h1>
        </a>

        <a href="../index.html" class="sair">
            <span>&#8618;</span>
        </a>
    </header>

    <main class="container">

        <section class="card-cadastro">

    <div class="lado-cadastro">

        <h2>Cadastro de Pacientes</h2>

        <hr>

        <form id="formTriagemPaciente" action="../backend/salvar_triagem.php" method="POST"
            enctype="multipart/form-data" class="form-cadastro">

            <div class="area-topo-cadastro">

                <div class="campos-paciente">

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>Nome Completo</label>
                            <input type="text" id="nome_paciente" name="nome_paciente" required>
                        </div>

                        <div class="grupo-input menor">
                            <label>Idade</label>
                            <input type="number" id="idade" name="idade" required>
                        </div>

                        <div class="grupo-input menor">
                            <label>Peso (kg)</label>
                            <input type="number" step="0.1" id="peso" name="peso" required>
                        </div>
                    </div>

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>CPF do Paciente</label>
                            <input type="text" id="cpf_paciente" name="cpf_paciente" maxlength="14" required>
                        </div>

                        

                        <div class="grupo-genero">
                            <label>Gênero</label>

                            <div class="opcoes-genero">
                                <label>
                                    <input type="radio" name="genero" value="Masculino">
                                    <span>Masculino</span>
                                </label>

                                <label>
                                    <input type="radio" name="genero" value="Feminino">
                                    <span>Feminino</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <hr class="divisoria-secao">
                   

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>Nome do Acompanhante / Responsável</label>
                            <input type="text" id="nome_acompanhante" name="nome_acompanhante" required>
                        </div>

                        <div class="grupo-input">
                            <label>CPF do Acompanhante / Responsável</label>
                            <input type="text" id="cpf_acompanhante" name="cpf_acompanhante" maxlength="14" required>
                        </div>

                        <div class="grupo-input">
                            <label>Telefone do Acompanhante / Responsável</label>
                            <input type="text" id="telefone_acompanhante" name="telefone_acompanhante" maxlength="15" required>
                        </div>
                    </div>

                </div>

                <div class="fotos-paciente">
                    <div class="titulo-fotos">
                        <h3>Fotos do Paciente</h3>
                        <p>Insira as fotos para análise facial</p>
                    </div>

                    <div class="foto-item">
                        <label for="fotoFrente" class="circulo-foto">
                            <img id="previewFrente" src="" alt="">
                            <i id="iconeFrente" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Rosto de frente</p>

                        <input type="file" id="fotoFrente" name="fotoFrente" accept="image/*" capture="environment">
                    </div>

                    <div class="foto-item">
                        <label for="fotoDireita" class="circulo-foto">
                            <img id="previewDireita" src="" alt="">
                            <i id="iconeDireita" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Lado direito</p>

                        <input type="file" id="fotoDireita" name="fotoDireita" accept="image/*" capture="environment">
                    </div>

                    <div class="foto-item">
                        <label for="fotoEsquerda" class="circulo-foto">
                            <img id="previewEsquerda" src="" alt="">
                            <i id="iconeEsquerda" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Lado esquerdo</p>

                        <input type="file" id="fotoEsquerda" name="fotoEsquerda" accept="image/*" capture="environment">
                    </div>

                </div>

            </div>

            <hr class="divisoria-secao">

            <h4>Checklist Clínico de Triagem (SXF)</h4>

            <div class="grid-sintomas"></div>

            <div class="area-calculo">
                <button type="button" class="btn-calcular" onclick="calcularScore()">
                    Calcular Prévia do Score
                </button>

                <div id="resultadoScore" class="card-resultado oculto">
                    <h4 id="tituloResultado">Resultado</h4>
                    <p id="textoResultado"></p>
                </div>
            </div>

            <button class="btn-salvar" type="button" onclick="salvarCadastro()">
                Salvar
            </button>

        </form>

    </div>

</section>

    </main>

    <script src="../public/js/cadastro-paciente.js"></script>
</body>

</html>
