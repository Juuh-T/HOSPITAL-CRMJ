<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>HOSPITAL CRMJ - Cadastro</title>
    <link rel="stylesheet" href="../public/css/cadastro-paciente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header>
        <h1>Hospital CRMJ</h1>

        <a href="../index.html" class="sair">
            <span>&#8618;</span>
        </a>
    </header>

    <main class="container">

        <section class="card-cadastro">

            <div class="lado-cadastro">

                <h2>Cadastro de Pacientes</h2>

                <hr>

                <form id="formTriagemPaciente" action="../backend/salvar_triagem.php" method="POST"
                    enctype="multipart/form-data" class="form-cadastro">

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>Nome Completo do Paciente</label>
                            <input type="text" id="nome_paciente" name="nome_paciente" required>
                        </div>
                        <div class="grupo-input menor">
                            <label>Idade</label>
                            <input type="number" id="idade" name="idade" required>
                        </div>
                        <div class="grupo-input menor">
                            <label>Peso (kg)</label>
                            <input type="number" step="0.1" id="peso" name="peso" required>
                        </div>
                    </div>

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>CPF do Paciente</label>
                            <input type="text" id="cpf_paciente" name="cpf_paciente" maxlength="14" required>
                        </div>
                        <div class="grupo-input">
                            <label>Sexo Biológico</label>
                            <select id="sexo" name="sexo" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                            </select>
                        </div>
                    </div>

                    <hr class="divisoria-secao">

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>Nome do Acompanhante / Responsável</label>
                            <input type="text" id="nome_acompanhante" name="nome_acompanhante" required>
                        </div>
                        <div class="grupo-input">
                            <label>CPF do Acompanhante</label>
                            <input type="text" id="cpf_acompanhante" name="cpf_acompanhante" maxlength="14" required>
                        </div>
                        <div class="grupo-input">
                            <label>Telefone do Acompanhante</label>
                            <input type="text" id="telefone_acompanhante" name="telefone_acompanhante" maxlength="15"
                                placeholder="(00) 00000-0000" required>
                        </div>
                    </div>

                    <hr class="divisoria-secao">

                    <h3>Checklist Clínico de Triagem (SXF)</h3>
                    <div class="grid-sintomas">
                    </div>

                    <div class="area-calculo">
                        <button type="button" class="btn-calcular" onclick="calcularScore()">Calcular Prévia do
                            Score</button>
                        <div id="resultadoScore" class="card-resultado oculto">
                            <h4 id="tituloResultado">Resultado</h4>
                            <p id="textoResultado"></p>
                        </div>
                    </div>

                    <hr class="divisoria-secao">

                    <h3>Fotos Clínicas (Limite de 4)</h3>
                    <div class="linha-fotos">

                        <div class="foto-item">
                            <label for="fotoFrente" class="circulo-foto">
                                <img id="preview0" src="" alt="" class="oculto">
                                <i id="icone0" class="bi bi-camera-fill"></i>
                            </label>
                            <p>Rosto Frente</p>
                            <input type="file" id="fotoFrente" name="fotos_paciente[]" accept="image/*"
                                onchange="previewFoto(this, 0)">
                        </div>

                        <div class="foto-item">
                            <label for="fotoDireita" class="circulo-foto">
                                <img id="preview1" src="" alt="" class="oculto">
                                <i id="icone1" class="bi bi-camera-fill"></i>
                            </label>
                            <p>Lado Direito</p>
                            <input type="file" id="fotoDireita" name="fotos_paciente[]" accept="image/*"
                                onchange="previewFoto(this, 1)">
                        </div>

                        <div class="foto-item">
                            <label for="fotoEsquerda" class="circulo-foto">
                                <img id="preview2" src="" alt="" class="oculto">
                                <i id="icone2" class="bi bi-camera-fill"></i>
                            </label>
                            <p>Lado Esquerdo</p>
                            <input type="file" id="fotoEsquerda" name="fotos_paciente[]" accept="image/*"
                                onchange="previewFoto(this, 2)">
                        </div>

                        <div class="foto-item">
                            <label for="fotoExtra" class="circulo-foto">
                                <img id="preview3" src="" alt="" class="oculto">
                                <i id="icone3" class="bi bi-camera-fill"></i>
                            </label>
                            <p>Corpo Inteiro / Extra</p>
                            <input type="file" id="fotoExtra" name="fotos_paciente[]" accept="image/*"
                                onchange="previewFoto(this, 3)">
                        </div>

                    </div>

                    <button type="submit" class="btn-salvar" style="margin-top: 30px; width: 100%;">Finalizar e Salvar
                        Cadastro</button>

                </form>

            </div>

            <div class="divisoria"></div>

            <div class="lado-foto">

                <div class="fotos-paciente">

                    <div class="foto-item">
                        <label for="fotoFrente" class="circulo-foto">
                            <img id="previewFrente" src="" alt="">
                            <i id="iconeFrente" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Rosto de frente</p>

                        <input type="file" id="fotoFrente" accept="image/*" capture="environment">
                    </div>

                    <div class="foto-item">
                        <label for="fotoDireita" class="circulo-foto">
                            <img id="previewDireita" src="" alt="">
                            <i id="iconeDireita" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Lado direito</p>

                        <input type="file" id="fotoDireita" accept="image/*" capture="environment">
                    </div>

                    <div class="foto-item">
                        <label for="fotoEsquerda" class="circulo-foto">
                            <img id="previewEsquerda" src="" alt="">
                            <i id="iconeEsquerda" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Lado esquerdo</p>

                        <input type="file" id="fotoEsquerda" accept="image/*" capture="environment">
                    </div>

                </div>

                <button class="btn-salvar" type="button" onclick="salvarCadastro()">Salvar</button>

            </div>

            </div>

        </section>

    </main>

    <script src="../public/js/cadastro-paciente.js"></script>
</body>

</html>
