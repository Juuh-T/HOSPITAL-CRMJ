<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>HOSPITAL CRMJ - Cadastro</title>
    <link rel="stylesheet" href="../public/css/cadastro-paciente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header>
        <h1>Hospital CRMJ</h1>

        <a href="../index.html" class="sair">
            <span>&#8618;</span>
        </a>
    </header>

    <main class="container">

        <section class="card-cadastro">

            <div class="lado-cadastro">

                <h2>Cadastro de Pacientes</h2>

                <hr>

                <form class="form-cadastro">

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>Nome</label>
                            <input type="text" id="nome">
                        </div>

                        <div class="grupo-input sobrenome">
                            <label>Sobrenome</label>
                            <input type="text" id="sobrenome">
                        </div>
                    </div>

                    <div class="linha-inputs">
                        <div class="grupo-input cpf">
                            <label>CPF</label>
                            <input type="text" id="cpf" maxlength="14">
                        </div>

                        <div class="grupo-input data-nascimento">
                            <label>Data de Nascimento</label>

                            <div class="inputs-data">
                                <input type="text" id="diaNascimento" maxlength="2" placeholder="Dia">
                                <input type="text" id="mesNascimento" maxlength="2" placeholder="Mês">
                                <input type="text" id="anoNascimento" maxlength="4" placeholder="Ano">
                            </div>
                        </div>
                    </div>

                    <div class="linha-inputs linha-peso-genero">

                        <div class="grupo-input peso">
                            <label>Peso</label>

                            <div class="input-com-unidade">
                                <input type="text" id="peso" maxlength="5">
                            </div>
                        </div>

                        <div class="grupo-genero">
                            <label>Gênero</label>

                            <div class="opcoes-genero">
                                <label>
                                    <input type="radio" name="genero" value="Masculino">
                                    <span>Masculino</span>
                                </label>

                                <label>
                                    <input type="radio" name="genero" value="Feminino">
                                    <span>Feminino</span>
                                </label>
                            </div>
                        </div>

                    </div>


                </form>

            </div>

            <div class="divisoria"></div>

            <div class="lado-foto">

                <div class="fotos-paciente">

                    <div class="foto-item">
                        <label for="fotoFrente" class="circulo-foto">
                            <img id="previewFrente" src="" alt="">
                            <i id="iconeFrente" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Rosto de frente</p>

                        <input type="file" id="fotoFrente" accept="image/*" capture="environment">
                    </div>

                    <div class="foto-item">
                        <label for="fotoDireita" class="circulo-foto">
                            <img id="previewDireita" src="" alt="">
                            <i id="iconeDireita" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Lado direito</p>

                        <input type="file" id="fotoDireita" accept="image/*" capture="environment">
                    </div>

                    <div class="foto-item">
                        <label for="fotoEsquerda" class="circulo-foto">
                            <img id="previewEsquerda" src="" alt="">
                            <i id="iconeEsquerda" class="bi bi-camera-fill"></i>
                        </label>

                        <p>Lado esquerdo</p>

                        <input type="file" id="fotoEsquerda" accept="image/*" capture="environment">
                    </div>

                </div>

                <button class="btn-salvar" type="button" onclick="salvarCadastro()">Salvar</button>

            </div>

            </div>

        </section>

    </main>

    <script src="../public/js/cadastro-paciente.js"></script>
</body>

</html>
