<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>HOSPITAL CRMJ - Login</title>
    <link rel="stylesheet" href="frontend/css/index.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <header class="fundo">
    </header>
    
    <div class="wrapper">
        <!--colocar o form para logar-->
        <h1>Hospital CRMJ</h1>
        <h2>Login</h2>

        <div class="input-field">
            <input type="text" id="usuario" required placeholder="Usuário"> <!-- Login usuario --> 
        </div>
        <div class="input-field">
            <input type="password" id="senha" required placeholder="Senha"> <!-- Login senha-->
            <span class="olho-senha" onclick="mostrarSenha()">
                <i id="iconeOlho" class="bi bi-eye-slash"></i>
            </span>
        </div>

        <button class="btnEntrar" onclick="js_fazerLogin()" type="button">Entrar</button> <!-- chama funcao de verificar login js-->
        
        <div class="cadastro">
            <p>Não possui cadastro? <a href="frontend/cadastro.html" target="_blank" class="btnCadastro">Cadastrar</a></p>
        </div> 
    </div>

    <img src="https://images-workbench.99static.com/4Jfskl1JfIdiGcxmYpzM8OZUhHg=/99designs-contests-attachments/151/151292/attachment_151292258" alt="Imagem hospital" class="imagem-login">
    <script src="frontend/js/index.js"></script>

</body>

</html>
