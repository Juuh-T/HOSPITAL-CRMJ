<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>HOSPITAL CRMJ - Cadastro</title>
    <link rel="stylesheet" href="frontend/css/cadastro.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <header>
        <h1>Hospital CRMJ</h1>

        <a href="frontend/index.html" class="sair">
            <span>&#8618;</span>
        </a>
    </header>

    <main class="container">

        <section class="card-cadastro">

            <div class="lado-cadastro">

                <h2>Cadastro de Profissional</h2>

                <hr>

                <form class="form-cadastro">

                    <div class="linha-inputs">
                        <div class="grupo-input">
                            <label>Nome</label>
                            <input type="text" id="nome">
                        </div>

                        <div class="grupo-input sobrenome">
                            <label>Sobrenome</label>
                            <input type="text" id="sobrenome">
                        </div>
                    </div>

                    <div class="linha-inputs">
                        <div class="grupo-input cpf">
                            <label>CPF</label>
                            <input type="text" id="cpf" maxlength="14">
                        </div>

                        <div class="grupo-input data-nascimento">
                            <label>Data de Nascimento</label>

                            <div class="inputs-data">
                                <input type="text" id="diaNascimento" maxlength="2" placeholder="Dia">
                                <input type="text" id="mesNascimento" maxlength="2" placeholder="Mês">
                                <input type="text" id="anoNascimento" maxlength="4" placeholder="Ano">
                            </div>
                        </div>
                    </div>

                    <div class="grupo-genero">
                        <label>Gênero</label>

                        <div class="opcoes-genero">
                            <label>
                                <input type="radio" name="genero" value="Masculino">
                                <span>Masculino</span>
                            </label>

                            <label>
                                <input type="radio" name="genero" value="Feminino">
                                <span>Feminino</span>
                            </label>

                        </div>
                    </div>

                    <div class="grupo-input data-admissao">
                        <label>Data de Admissão</label>

                        <div class="inputs-data">
                            <input type="text" id="diaAdmissao" maxlength="2" placeholder="Dia">
                            <input type="text" id="mesAdmissao" maxlength="2" placeholder="Mês">
                            <input type="text" id="anoAdmissao" maxlength="4" placeholder="Ano">
                        </div>
                    </div>

                </form>

            </div>

            <div class="divisoria"></div>

            <div class="lado-login">

                <h3>Login</h3>

                <div class="grupo-login">
                    <input type="text" id="usuario" placeholder="Usuário">
                </div>

                <div class="grupo-login">
                    <input type="password" id="senha" placeholder="Senha">

                    <span class="olho-senha" onclick="mostrarSenha('senha', 'iconeSenha')">
                        <i id="iconeSenha" class="bi bi-eye-slash"></i>
                    </span>
                </div>

                <div class="grupo-login">
                    <input type="password" id="confirmarSenha" placeholder="Confirme a senha">

                    <span class="olho-senha" onclick="mostrarSenha('confirmarSenha', 'iconeConfirmarSenha')">
                        <i id="iconeConfirmarSenha" class="bi bi-eye-slash"></i>
                    </span>
                </div>

                <button class="btn-salvar" onclick="salvarCadastro()">Salvar</button>

            </div>

        </section>

    </main>

    <script src="frontend/js/cadastro.js"></script>
</body>

</html>
