<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOSPITAL CRMJ - Paciente</title>
    <link rel="stylesheet" href="css/paciente.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header>
        <h1>Hospital CRMJ</h1>
        <div class="sair">
            <a href="../index.html" target="_blank"><span class="sair-icon">&#8618</span> </a>
        </div>
    </header>

    <main class="container">

        <aside class="sidebar">
            <div class="barra-pesquisa">
                <i class="bi bi-search lupa"></i>
                <div class="input-field">
                    <input type="text" required placeholder="Pesquisar nome do paciente">
                </div>
            </div>

            <div class="painel-lateral">
                <button class="btn-add">Adicionar paciente</button>
                <hr>
                <div class="lista-pacientes">
                    <div class="paciente">
                        <div class="paciente-info">
                            <i class="bi bi-person"></i>
                            <span>Paciente 1</span>
                        </div>
                        <span class="excluir-paciente">&#128465;</span>
                    </div>
                </div>
            </div>
        </aside>

        <section class="conteudo">
            <div class="cabecalho-paciente">
                <h2 id="tituloPaciente" contenteditable="true">Paciente 1</h2>
                <span class="olho" onclick="mudarOlho()">
                    <i id="iconeOlho" class="bi bi-eye"></i>
            </span>
            </div>

            <div class="dados">
                <p class="linha-dado">
                    <i class="bi bi-pencil-square"></i>
                    <span>Nome:</span>
                    <input type="text" class="campo-dado">
                </p>

                <p class="linha-dado">
                    <i class="bi bi-person"></i>
                    <span>CPF:</span>
                    <input type="text" id="cpf" class="campo-dado" maxlength="14">
                </p>

                <div class="linha-dado">
                    <i class="bi bi-gender-ambiguous"></i>
                    <span>Sexo:</span>

                    <div class="select-personalizado">
                        <div class="select-escolhido" onclick="abrirSexo()"></div>

                        <div class="opcoes-sexo" id="opcoesSexo">
                            <div onclick="selecionarSexo('Masculino')">Masculino</div>
                            <div onclick="selecionarSexo('Feminino')">Feminino</div>
                        </div>
                    </div>
                </div>

                <p class="linha-dado">
                    <i class="bi bi-telephone"></i>
                    <span>Telefone:</span>
                    <input type="text" id="telefone" class="campo-dado" maxlength="19">
                </p>

                <p class="linha-dado">
                    <i class="bi bi-cake"></i>
                    <span>Nascimento:</span>
                    <input type="text" id="nascimento" class="campo-dado" maxlength="10">
                </p>
            </div>

            <div class="linha-checklist">
                <h2>Checklist</h2>
                <!-- <h2>Score: XXXXXXXX</h2> -->
            </div>

            <textarea class="checklist" placeholder="Escreva aqui o checklist do paciente..."></textarea>

        </section>

    </main>
    <script src="js/paciente.js"></script>
</body>
</html>
